apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-service-network-policy
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: webhook-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: payments
      ports:
        - protocol: TCP
          port: 3003
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
